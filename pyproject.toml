[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foli-decon"
version = "0.1.0"
description = "Unified wrappers for Foli-seq cell type deconvolution tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Foli Decon Contributors"}
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "anndata>=0.10",
]

[project.optional-dependencies]
r = [
  "rpy2>=3.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
